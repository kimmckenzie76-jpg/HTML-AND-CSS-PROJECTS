<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>One Page Website</title>
    <link rel="stylesheet" href="CSS/one_page_website.css">

</head>

<body>

<!-- NAVIGATION (Instructor Style) -->
<nav>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#video">Video</a></li>
        <li><a href="#footer">Footer</a></li>
        </ul>
</nav>

<!-- HOME SECTION -->
<section id="home">
    <h1>Welcome to My One Page Website</h1>
    <p>
        This is a simple one-page website created using basic HTML.
        It includes navigation, images, a contact form, a video, and a footer.
    </p>
</section>

<!-- IMAGE SECTION -->
<section id="gallery">
    <h2>Image Gallery</h2>

    <img src="https://via.placeholder.com/200" alt="Placeholder image one">
    <img src="https://via.placeholder.com/200" alt="Placeholder image two">
    <img src="https://via.placeholder.com/200" alt="Placeholder image three">
</section>

<!-- CONTACT FORM -->
<section id="contact">
    <h2>Contact Us</h2>

    <form>
        <label for="name">Name:</label><br>
        <input id="name" type="text" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input id="email" type="email" name="email"><br><br>

        <label for="message">Message:</label><br>
        <input id="message" type="text" name="message"><br><br>


        <input type="submit" value="Send">
    </form>
</section>

<!-- VIDEO SECTION -->
<section id="video">
    <h2>Featured Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/ng58pNPDDW4"
        title="YouTube video"
        allowfullscreen>
    </iframe>
</section>

<!-- FOOTER -->
<footer id="footer">
    <p>&copy; 2026 One Page Website</p>
</footer>

</body>
</html>
